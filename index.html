<html lang="en">
<head>

<body>
  <div id="app">
    <header id="topbar"></header>
    <aside id="left"></aside>
    <main id="boardWrap">
      <svg id="board" viewBox="-500 -500 1000 1000" preserveAspectRatio="xMidYMid meet"></svg>
      <div id="tooltip" class="hidden"></div>
    </main>
    <aside id="right"></aside>
  </div>
  <div id="modal" class="hidden"><div class="modal-card" id="modalCard"></div></div>
  <div id="ticker"><div id="tickerTrack"></div></div>
  <div id="toasts"></div>
  <div id="fxLayer"></div>
  <div id="fxFlash"></div>
  <div id="bridgePill" class="hidden">CLI</div>
  <div id="interstitial" class="hidden"></div>
  <div id="clock" class="hidden"></div>
  <div id="splash" class="hidden"><div class="splash-title">FRONTIER</div><div class="splash-sub">Found a lab. Race to AGI. Try not to repeat history.</div>
    <div class="splash-quote"></div><div class="splash-load"><span></span></div><div class="splash-hint">click to skip</div></div>
  <div id="advisor" class="hidden"><div class="adv-head">Chief of staff <button class="btn" onclick="this.closest('#advisor').classList.add('hidden')">Close</button></div><div class="adv-body"></div></div>
